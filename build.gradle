plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

// Optional version profile: ./gradlew build -Pmc=1.21.1
def profileName = project.findProperty('mc')
if (profileName != null) {
    def profileFile = file("gradle/profiles/${profileName}.properties")
    if (!profileFile.exists()) {
        throw new GradleException("Unknown Minecraft profile '${profileName}'. Add gradle/profiles/${profileName}.properties.")
    }
    def profile = new Properties()
    profileFile.withInputStream { profile.load(it) }
    profile.each { key, value -> project.ext.set(key.toString(), value.toString()) }
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    maven {
        name = 'Nucleoid'
        url = 'https://maven.nucleoid.xyz/'
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Optional integrations: only loaded when the user has them installed.
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    modLocalRuntime "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dep', project.minecraft_dep
    inputs.property 'mixin_compat', project.mixin_compat
    filesMatching('fabric.mod.json') {
        expand 'version': project.version, 'minecraft_dep': project.minecraft_dep
    }
    filesMatching('paymentfx.mixins.json') {
        expand 'mixin_compat': project.mixin_compat
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(project.java_version as int)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = project.java_version as int
    it.options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}
